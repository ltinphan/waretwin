name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.11", cache: pip, cache-dependency-path: backend/requirements.lock }
      # 跟 Render / Docker 裝同一份 lock，lock 壞掉 CI 會先紅；pip check 確認沒有相依衝突
      - run: pip install -r requirements.lock && pip install "pytest>=8,<10" "httpx>=0.27,<1"
      - run: pip check
      - run: python -m pytest -q
        env: { TWIN_DB: /tmp/twin_ci.db }
  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.11", cache: pip, cache-dependency-path: backend/requirements.lock }
      - run: pip install -r ../backend/requirements.lock
      - uses: actions/setup-node@v5
        with: { node-version: 20, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm test
      - run: npm run build

  webhook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - env: { DEPLOY_TOKEN: ci-test-token }
        run: |
          bash scripts/webhook-deploy.sh --self-test
          python3 scripts/webhook-deploy.py --self-test

  deploy:
    needs: [backend, frontend, webhook]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Trigger host deploy webhook
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}   # header, never the URL (keeps it out of access logs)
        run: |
          curl -fsS --max-time 60 -H "X-Deploy-Token: ${DEPLOY_TOKEN}" https://waretwin.tinrobotics.com/deploy
